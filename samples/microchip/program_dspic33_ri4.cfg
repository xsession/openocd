set MCHP_RI4_SCRIPTS C:/Users/livanyi/Desktop/WORK/GIT/openocd/externals/open_microchip_tools/vendor/mplabx_yaml_gz/packs/Microchip/PICkit4_TP/2.12.2541/firmware/scripts.yaml

