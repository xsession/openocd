name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "docker/Dockerfile.docs"
      - "docker/scripts/build-docs.sh"
      - "mkdocs.yml"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  pull_request:
    paths:
      - "docs/**"
      - "docker/Dockerfile.docs"
      - "docker/scripts/build-docs.sh"
      - "mkdocs.yml"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: python3 tools/docs/generate_support_tables.py --check
      - run: python3 -m mkdocs build --strict --site-dir docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-documentation-html
          path: docs/_build/html
          if-no-files-found: error
