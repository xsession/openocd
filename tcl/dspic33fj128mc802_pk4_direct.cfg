# Direct programming config - skips examine which requires GetPC
set MCHP_RI4_PROCESSOR dsPIC33FJ128MC802
set MCHP_RI4_PC_BYTES 4
set MCHP_RI4_FAMILY DSPIC33
if {![info exists MCHP_RI4_SCRIPTS]} {
	error "set MCHP_RI4_SCRIPTS to a PICkit 4 scripts.yaml or scripts.yaml.gz catalog"
}
set MCHP_RI4_TOOL pk4
set MCHP_RI4_VID 0x04d8
set MCHP_RI4_PID 0x9012

# Source target config (also sources interface/mchp-ri4.cfg)
source [find target/mchp-ri4.cfg]

# Initialize - opens PICkit4 USB session
# Note: examine will fail on GetPC but init still succeeds
init

# Program the firmware directly
if {![info exists MCHP_RI4_FIRMWARE]} {
	error "set MCHP_RI4_FIRMWARE to the firmware image to program"
}
mchp_ri4 program mchp.cpu $MCHP_RI4_FIRMWARE verify

# Release the target so firmware starts running
resume
sleep 500

shutdown
