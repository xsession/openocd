#
# Program a dsPIC33FJ128MC802 with PICkit 4 using OpenOCD's native RI4 path.
#
# Run from the OpenOCD source tree:
#   openocd -s tcl \
#     -c "set MCHP_RI4_SCRIPTS path/to/scripts.xml" \
#     -f examples/microchip/dspic33fj128mc802-pickit4-program.cfg
#
# The native RI4 backend does not shell out to IPECMD. It still needs a RI4
# script catalog because those device-specific programming sequences are not
# shipped in this OpenOCD tree.
if {![info exists MCHP_RI4_SCRIPTS]} {
	error "set MCHP_RI4_SCRIPTS to a RI4 scripts.xml or scripts.yaml.gz catalog"
}

set MCHP_RI4_PROCESSOR dsPIC33FJ128MC802
set MCHP_RI4_PC_BYTES 4

source [find programmer/microchip/pickit4-ri4.cfg]

set _firmware [file normalize [file join [file dirname [info script]] fw-s FW-26-55-00_v1_3.HEX]]
init
mchp_ri4 program $TARGETNAME $_firmware verify
shutdown
